<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Arena</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">

</head>

<body>

<div class="caja-menu marco-neon">

    <h1 class="titulo-juego">Kitchen Arena</h1>

    <!-- BOTONES LOGIN / REGISTRO -->
    <div class="d-flex justify-content-center gap-3 mb-4">

        <button
            class="btn btn-outline-light glow"
            data-bs-toggle="modal"
            data-bs-target="#loginModal"
        >
            Login
        </button>

        <button
            class="btn btn-outline-warning glow"
            data-bs-toggle="modal"
            data-bs-target="#registroModal"
        >
            Registro
        </button>

    </div>


    <!-- BOTONES DEL JUEGO -->
    <div class="d-grid gap-3 col-12 col-md-6 mx-auto">

        <button class="btn btn-lg btn-danger glow" onclick="entrarJuego(1)">
            Escenario 1
        </button>

        <button class="btn btn-lg btn-warning glow" onclick="entrarJuego(2)">
            Escenario 2
        </button>

        <button class="btn btn-lg btn-info glow" onclick="entrarJuego(3)">
            Escenario 3
        </button>

        <a href="configuracion.html" class="btn btn-lg btn-secondary glow">
            Configuración
        </a>

        <a href="puntuaciones.html" class="btn btn-lg btn-light glow">
            Puntuaciones
        </a>

    </div>

</div>

<!-- MODAL LOGIN -->
<div class="modal fade" id="loginModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content modal-neon">

            <div class="modal-header border-0">

                <h3 class="modal-title text-white">
                    Iniciar Sesión
                </h3>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input
                    id="correoLogin"
                    type="email"
                    class="form-control mb-3 input-jugador"
                    placeholder="Correo"
                >

                <input
                    id="passwordLogin"
                    type="password"
                    class="form-control mb-3 input-jugador"
                    placeholder="Contraseña"
                >

                <button
                    class="btn btn-success glow w-100"
                    onclick="login()"
                >
                    Entrar
                </button>

                <div class="mt-3">
                    <button class="btn btn-primary w-100" onclick="fbLogin()">
                        Iniciar con Facebook
                    </button>
                </div>

            </div>

        </div>

    </div>

</div>

<!-- MODAL REGISTRO -->
<div class="modal fade" id="registroModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content modal-neon">

            <div class="modal-header border-0">

                <h3 class="modal-title text-white">
                    Registro
                </h3>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input
                    id="usuarioRegistro"
                    type="text"
                    class="form-control mb-3 input-jugador"
                    placeholder="Usuario"
                    maxlength="20"
                >

                <input
                    id="correoRegistro"
                    type="email"
                    class="form-control mb-3 input-jugador"
                    placeholder="Correo"
                >

                <input
                    id="passwordRegistro"
                    type="password"
                    class="form-control mb-3 input-jugador"
                    placeholder="Contraseña"
                >

                <button
                    class="btn btn-warning glow w-100"
                    onclick="registrar()"
                >
                    Registrarse
                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>


<script>
    window.fbAsyncInit = function() {
        FB.init({
            appId      : '3377754062379356',
            cookie     : true,
            xfbml      : true,
            version    : 'v24.0'
        });
        FB.AppEvents && FB.AppEvents.logPageView && FB.AppEvents.logPageView();
    };

    (function(d, s, id){
         var js, fjs = d.getElementsByTagName(s)[0];
         if (d.getElementById(id)) {return;}
         js = d.createElement(s); js.id = id;
         js.src = "https://connect.facebook.net/es_LA/sdk.js";
         fjs.parentNode.insertBefore(js, fjs);
     }(document, 'script', 'facebook-jssdk'));
</script>

</body>
</html>
