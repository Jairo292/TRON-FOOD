<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Puntuaciones - Kitchen Arena</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <link href="puntuaciones.css" rel="stylesheet">

</head>

<body>

    <div class="caja-puntuaciones">

        <h2 class="titulo-seccion">
            Puntuaciones
        </h2>

        <table class="table table-dark table-hover text-center align-middle">

            <thead>

                <tr>
                    <th>#</th>
                    <th>Jugador</th>
                    <th>Puntos</th>
                </tr>

            </thead>

            <tbody id="tablaRanking">

                <!-- SE LLENA DESDE JS -->

            </tbody>

        </table>

        <a href="index.html" class="btn btn-secondary btn-custom">
            Volver al Menú
        </a>

    </div>

    <script>

        async function cargarRanking() {

            const tbody = document.getElementById("tablaRanking");

            try {

                const respuesta = await fetch("/ranking");

                const jugadores = await respuesta.json();

                tbody.innerHTML = "";

                if (jugadores.length === 0) {

                    tbody.innerHTML = `
                <tr>
                    <td colspan="3">
                        No hay puntuaciones todavía
                    </td>
                </tr>
            `;

                    return;
                }

                jugadores.forEach((jugador, index) => {

                    tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${jugador.usuario}</td>
                    <td>${jugador.puntaje_max}</td>
                </tr>
            `;

                });

            } catch (error) {

                console.log(error);

                tbody.innerHTML = `
            <tr>
                <td colspan="3">
                    Error al cargar puntuaciones
                </td>
            </tr>
        `;
            }

        }

        cargarRanking();

    </script>

</body>

</html>
